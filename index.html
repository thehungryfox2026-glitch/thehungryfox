<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hungry Fox — Thurrock | Call to Order & Save 10%</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #4a3319;
            line-height: 1.6;
            background-color: #FFF2E6; /* Matches the updated bottom tone */
        }

        /* Hero Section with 60% Lighter Top Part */
        .hero-section {
            background-color: #FFFDFB; /* 60% lighter background color */
            text-align: center;
            padding: 60px 20px 140px 20px;
            position: relative;
        }

        /* Repaired Logo Setup with Even Gaps */
        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px; /* Controls even gap below the logo group */
        }

        .logo-image {
            width: 160px; /* Balanced sizing for the logo */
            height: auto;
            display: block;
            margin-bottom: 25px; /* Fixed even gap between fox image and text */
        }

        .brand-title {
            font-family: 'Georgia', serif;
            font-size: 2.5rem;
            color: #E66B27;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 400;
            margin: 0 0 15px 0; /* Even gap between title and subtitle */
        }

        .hero-tagline {
            font-size: 1.1rem;
            color: #7a6248;
            font-weight: 500;
            margin: 0;
        }

        /* Promo Boxes */
        .promo-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 35px auto;
            max-width: 600px;
            flex-wrap: wrap;
        }

        .promo-badge {
            background: #ffffff;
            border: 1px dashed #E66B27;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #E66B27;
            letter-spacing: 0.5px;
        }

        .hero-description {
            max-width: 620px;
            margin: 0 auto 35px auto;
            color: #8a735c;
            font-size: 0.95rem;
        }

        /* Primary Call Action Button */
        .cta-button {
            display: inline-block;
            background-color: #E66B27;
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 6px 20px rgba(230, 107, 39, 0.25);
            transition: transform 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-1px);
        }

        /* Transition B — Clean Curve Style Divider */
        .curve-divider {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            transform: rotate(180deg);
        }

        .curve-divider svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 80px;
        }

        .curve-divider .shape-fill {
            fill: #FFF2E6; /* Shifts directly into the closer bottom background tone */
        }

        /* Menu / Content Section */
        .content-section {
            background-color: #FFF2E6; /* Close in tone to the light top part */
            padding: 60px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- Top Hero Section -->
    <section class="hero-section">
        <div class="container">
            
            <!-- Repaired Layout with Real Logo & Proportional Gaps -->
            <div class="logo-wrapper">
                <!-- Replace 'logo.png' with your actual image file name if different -->
                <img src="logo.png" alt="The Hungry Fox Logo" class="logo-image">
                <h1 class="brand-title">The Hungry Fox</h1>
                <p class="hero-tagline">Thurrock, Essex · Halal · Open Daily 10:00–22:30</p>
            </div>

            <div class="promo-container">
                <div class="promo-badge">10% OFF PHONE ORDERS</div>
                <div class="promo-badge">FREE DELIVERY OVER £20</div>
            </div>

            <p class="hero-description">
                Home-cooked fried & baked chicken, hand-tossed in your flavour, made fresh to order. Ring us direct to save on every order.
            </p>

            <a href="tel:07356257445" class="cta-button">📞 Call 07356 257445 to Order</a>
        </div>

        <!-- Transition Option B: Clean Curve Divider -->
        <div class="curve-divider">
            <svg xmlns="http://w3.org" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,42.4V0Z" class="shape-fill"></path>
            </svg>
        </div>
    </section>

    <!-- Bottom Section -->
    <section class="content-section">
        <div class="container">
            <!-- Your full menu item loops and content go here -->
        </div>
    </section>

</body>
</html>
