<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hungry Fox — Thurrock | Call to Order & Save 10%</title>
    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            /* Theme Colors */
            --fox-orange: #E66B27;
            --fox-gold: #F3D39B;
            /* Top Part: 60% lighter background */
            --bg-top: #FFF9F3; 
            /* Bottom Part: Close in tone to top part */
            --bg-bottom: #FFF1E6; 
            --text-dark: #332211;
            --text-light: #775533;
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-top);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Top Hero Section */
        .hero-section {
            background-color: var(--bg-top);
            text-align: center;
            padding: 60px 20px 100px 20px;
            position: relative;
        }

        /* Repaired Logo Layout with Even Text Gaps */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo-svg {
            width: 180px;
            height: auto;
            margin-bottom: 25px; /* Even gap between icon and text */
        }

        .brand-title {
            font-family: 'Georgia', serif;
            font-size: 2.8rem;
            color: var(--fox-orange);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
            margin: 0;
            padding: 0;
        }

        .hero-tagline {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-top: 15px;
            font-weight: 500;
        }

        /* Promo Badge Grid */
        .promo-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px auto;
            max-width: 600px;
            flex-wrap: wrap;
        }

        .promo-badge {
            background: var(--white);
            border: 2px dashed var(--fox-orange);
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            color: var(--fox-orange);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .cta-button {
            display: inline-block;
            background-color: var(--fox-orange);
            color: var(--white);
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(230, 107, 39, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 15px;
        }

        .cta-button:hover {
            background-color: #d45a16;
            transform: translateY(-2px);
        }

        /* Transition B — Clean Curve Divider */
        .curve-divider {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            transform: rotate(180deg);
        }

        .curve-divider svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 70px;
        }

        .curve-divider .shape-fill {
            fill: var(--bg-bottom); /* Smooth transition into bottom color */
        }

        /* Bottom Menu Section */
        .menu-section {
            background-color: var(--bg-bottom);
            padding: 80px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 50px;
        }

        /* Menu Grid Design */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .menu-category {
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .category-title {
            font-size: 1.4rem;
            color: var(--fox-orange);
            border-bottom: 2px solid var(--bg-bottom);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #f0f0f0;
        }

        .item-info h4 {
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .item-info p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .item-price {
            font-weight: bold;
            color: var(--text-dark);
            white-space: nowrap;
        }

        /* App Links & Review Section */
        .footer-widgets {
            background-color: var(--white);
            padding: 50px 20px;
            text-align: center;
            border-radius: 20px;
            margin-top: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .app-btn {
            background: var(--bg-bottom);
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: bold;
            transition: background 0.2s;
        }

        .app-btn:hover {
            background: var(--fox-gold);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 0.9rem;
            background-color: var(--bg-bottom);
        }
    </style>
</head>
