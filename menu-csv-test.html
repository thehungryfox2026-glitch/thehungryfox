
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hungry Fox – Menu Design Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1326;
  color:#f1f5f9;
  font-family:'Plus Jakarta Sans',sans-serif;
}
header{
  background:#060e20;
  border-bottom:1px solid #263352;
  padding:22px 16px;
  text-align:center;
}
header img{width:165px;max-height:72px;object-fit:contain}
h1{font:800 32px 'Playfair Display',serif;margin:10px 0 4px}
header p{color:#94a3b8;font-size:12px;margin:0}
main{max-width:1120px;margin:auto;padding:22px 16px}
.notice{
  background:#131b2e;border:1px solid #263352;border-radius:10px;
  padding:12px;margin-bottom:16px;color:#cbd5e1;font-size:12px;
}
#status{color:#fbbf24;font-size:12px;margin:12px 0}
#categories{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
#categories button{
  background:#131b2e;color:#cbd5e1;border:1px solid #263352;
  border-radius:30px;padding:9px 13px;cursor:pointer;
  font-weight:700;font-size:11px;
}
#categories button.active{background:#f97316;color:#07101f;border-color:#f97316}

#products{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
  align-items:stretch;
}
.card{
  background:linear-gradient(145deg,#172239,#111a2d);
  border:1px solid #2a3956;
  border-radius:13px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100%;
  transition:border-color .2s,transform .2s;
}
.card:hover{border-color:#f97316;transform:translateY(-2px)}
.photo-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#0b1326;
  overflow:hidden;
}
.photo{
  display:block;width:100%;height:100%;object-fit:cover;
}
.no-photo{
  width:100%;aspect-ratio:16/9;
  display:flex;align-items:center;justify-content:center;
  color:#52617b;font-size:11px;background:#101a2d;
}
.card-content{
  padding:13px;
  display:flex;
  flex-direction:column;
  flex:1;
}
.category{
  color:#34d49a;font-size:9px;font-weight:800;
  letter-spacing:1px;margin-bottom:7px;
}
.product-heading{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:9px;margin-bottom:7px;
}
.card h3{
  color:#fff;font-size:14px;line-height:1.35;
  margin:0;font-weight:800;
}
.price{
  color:#fb923c;font-size:15px;font-weight:800;
  white-space:nowrap;line-height:1.3;
}
.description{
  color:#aab6c8;font-size:11px;line-height:1.5;
  margin:0 0 12px;
}
.card-bottom{margin-top:auto}
.options{
  border-top:1px solid #2a3956;
  padding-top:9px;
}
.options details{width:100%}
.options summary{
  list-style:none;cursor:pointer;display:flex;
  align-items:center;justify-content:space-between;
  gap:8px;color:#fb923c;font-size:11px;font-weight:800;
}
.options summary::-webkit-details-marker{display:none}
.options summary:after{
  content:"+";font-size:17px;line-height:1;color:#fb923c;
}
.options details[open] summary:after{content:"−"}
.options-list{
  padding:9px 0 0 15px;margin:0;
  color:#cbd5e1;font-size:10px;line-height:1.7;
}
.options-list li{padding-left:2px}
.choose{
  color:#94a3b8;font-size:10px;margin-top:7px;
}
.no-options{
  color:#64748b;font-size:10px;
  border-top:1px solid #2a3956;padding-top:9px;
}
.empty{
  color:#94a3b8;padding:25px;text-align:center;grid-column:1/-1;
}
footer{text-align:center;padding:25px;color:#64748b;font-size:11px}

@media(max-width:850px){
  #products{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  main{padding:15px 11px}
  #products{gap:9px}
  .card-content{padding:10px}
  .card h3{font-size:12px}
  .price{font-size:13px}
  .description{font-size:10px}
  .category{font-size:8px}
  .options summary{font-size:10px}
}
</style>
</head>

<body>
<header>
  <img src="https://thehungryfox.co.uk/hungry-fox-logo-cream.webp" alt="The Hungry Fox">
  <h1>Our Menu</h1>
  <p>Menu data test · Powered by the master spreadsheet</p>
</header>

<main>
  <div class="notice">
    <strong>TEST PAGE ONLY</strong><br>
    This page reads menu information from the GitHub CSV files. It does not take orders or change the live website.
  </div>
  <div id="status">Loading menu data…</div>
  <nav id="categories" aria-label="Menu categories"></nav>
  <section id="products"></section>
</main>

<footer>The Hungry Fox · Grays, Thurrock</footer>

<script>
const BASE = "https://raw.githubusercontent.com/thehungryfox2026-glitch/thehungryfox/main/";

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], cell = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];

    if (c === '"' && quoted && next === '"') {
      cell += '"'; i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === "," && !quoted) {
      row.push(cell); cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && next === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else {
      cell += c;
    }
  }

  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);

  const headers = rows.shift().map(h => h.trim());
  return rows.map(values => {
    const item = {};
    headers.forEach((h, i) => item[h] = (values[i] || "").trim());
    return item;
  });
}

async function loadCSV(filename) {
  const response = await fetch(BASE + filename + "?v=" + Date.now());
  if (!response.ok) throw new Error(filename + " could not be loaded (" + response.status + ")");
  return parseCSV(await response.text());
}

let products = [];
let customisations = [];
let groups = [];
let selectedCategory = "ALL";

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderCategories() {
  const categories = [...new Set(products.map(p => p.Category).filter(Boolean))];
  const all = ["ALL", ...categories];

  document.getElementById("categories").innerHTML = all.map(category =>
    `<button class="${category === selectedCategory ? "active" : ""}"
      data-category="${safe(category)}">
      ${category === "ALL" ? "All products" : safe(category)}
    </button>`
  ).join("");

  document.querySelectorAll("#categories button").forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;
      renderCategories();
      renderProducts();
    });
  });
}

function optionsFor(product) {
  const productGroups = groups.filter(g => g.Product_ID === product.Product_ID);
  if (!productGroups.length) return "";

  const sections = productGroups.map(group => {
    const options = customisations
      .filter(option =>
        option.Active.toUpperCase() === "TRUE" &&
        option.Customisation_Group === group.Customization_Group &&
        (!option.Product_ID || option.Product_ID === product.Product_ID)
      )
      .sort((a,b) => Number(a.Display_Order || 0) - Number(b.Display_Order || 0));

    if (!options.length) return "";

    return `
      <div class="option-group">
        <div class="choose">Choose ${safe(group.Min_Selec)}–${safe(group.Max_Selec)}</div>
        <ul class="options-list">
          ${options.map(o => `
            <li>${safe(o.Option_Name)}${
              Number(o.Extra_Price) > 0
                ? " (+£" + Number(o.Extra_Price).toFixed(2) + ")"
                : ""
            }</li>
          `).join("")}
        </ul>
      </div>
    `;
  }).join("");

  if (!sections.trim()) return "";

  return `
    <div class="options">
      <details>
        <summary>Customise this item</summary>
        ${sections}
      </details>
    </div>
  `;
}

function renderProducts() {
  const visible = products.filter(p =>
    selectedCategory === "ALL" || p.Category === selectedCategory
  );

  document.getElementById("products").innerHTML = visible.length
    ? visible.map(p => {
        const photo = p.Photo_URL
          ? `<div class="photo-wrap"><img class="photo" src="${safe(p.Photo_URL)}" alt="${safe(p.Product_Name)}" loading="lazy"></div>`
          : `<div class="no-photo">The Hungry Fox</div>`;

        const options = optionsFor(p);

        return `
          <article class="card">
            ${photo}
            <div class="card-content">
              <div class="category">${safe(p.Category)}</div>
              <div class="product-heading">
                <h3>${safe(p.Product_Name)}</h3>
                <div class="price">£${Number(p.Price).toFixed(2)}</div>
              </div>
              ${p.Description ? `<p class="description">${safe(p.Description)}</p>` : ""}
              <div class="card-bottom">
                ${options || `<div class="no-options">No customisation options</div>`}
              </div>
            </div>
          </article>
        `;
      }).join("")
    : `<div class="empty">No available products in this category.</div>`;
}

async function start() {
  try {
    const [p, c, g] = await Promise.all([
      loadCSV("products.csv"),
      loadCSV("customisation.csv"),
      loadCSV("product_groups.csv")
    ]);

    products = p.filter(item => item.Availability.toUpperCase() === "TRUE");
    customisations = c;
    groups = g;

    renderCategories();
    renderProducts();

    document.getElementById("status").textContent =
      `Loaded ${products.length} available products, ${customisations.length} customization options and ${groups.length} product groups.`;
  } catch (error) {
    document.getElementById("status").textContent =
      "Menu loading error: " + error.message;
  }
}

start();
</script>
</body>
</html>
